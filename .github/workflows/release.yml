name: Build and Release Glacier.Studio

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Package Desktop Studio (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout Glacier.Studio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages NuGet Source
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name "github-packages" `
            --username "${{ github.repository_owner }}" `
            --password "${{ secrets.GITHUB_TOKEN }}" `
            --store-password-in-clear-text
        continue-on-error: true

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore src/Glacier.Studio/Glacier.Studio.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build src/Glacier.Studio/Glacier.Studio.csproj --configuration Release --no-restore

      - name: Publish Standalone Desktop Binaries (win-x64 & win-arm64)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $TagName = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref }}".Substring(10) } else { "v1.0.0" }

          dotnet publish src/Glacier.Studio/Glacier.Studio.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "release-assets/glacier-studio-$TagName-win-x64.zip" -Force

          dotnet publish src/Glacier.Studio/Glacier.Studio.csproj -c Release -r win-arm64 --self-contained true -o publish/win-arm64
          Compress-Archive -Path "publish/win-arm64/*" -DestinationPath "release-assets/glacier-studio-$TagName-win-arm64.zip" -Force

      - name: Upload Build Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: glacier-studio-win-x64
          path: src/Glacier.Studio/bin/Release/net10.0/
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
